<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Раскладка груза в кузове</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: rgba(0, 0, 0, 0.1);
    --fill: rgba(120, 120, 128, 0.12);
    --fill-hover: rgba(120, 120, 128, 0.2);
    --body-fill: #eef0f4;
    --grid: rgba(0, 0, 0, 0.07);
    --accent: #0071e3;
    --glass: rgba(245, 245, 247, 0.72);
    --danger: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --panel: #1c1c1e;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: rgba(255, 255, 255, 0.14);
      --fill: rgba(120, 120, 128, 0.24);
      --fill-hover: rgba(120, 120, 128, 0.36);
      --body-fill: #2a2a2d;
      --grid: rgba(255, 255, 255, 0.08);
      --accent: #2997ff;
      --glass: rgba(0, 0, 0, 0.72);
      --danger: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    line-height: 1.47;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
  }

  /* верхняя панель в стиле Liquid Glass */
  .nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 48px;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .nav b { font-weight: 600; }
  .nav span { color: var(--muted); }

  .hero { padding: 56px 24px 32px; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1.07;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .lead {
    margin: 12px auto 0; max-width: 560px;
    font-size: clamp(17px, 2vw, 21px);
    line-height: 1.3; color: var(--muted); letter-spacing: -0.01em;
  }

  main {
    display: grid;
    grid-template-columns: 300px 1fr 360px;
    gap: 20px;
    padding: 8px 24px 48px;
    align-items: start;
    max-width: 1800px; margin: 0 auto;
  }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; padding: 8px 14px 32px; }
    .hero { padding: 36px 16px 20px; }
  }
  .col { display: grid; gap: 20px; }
  section {
    background: var(--panel);
    border-radius: 24px;
    padding: 24px;
  }
  h2 { margin: 0 0 16px; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  input[type="number"], input[type="text"] {
    width: 100%;
    font: inherit; font-size: 17px; color: var(--ink);
    background: var(--fill);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 10px 12px;
    transition: box-shadow .15s, border-color .15s, background .15s;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .unit { color: var(--muted); font-size: 15px; min-width: 24px; }

  .info {
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 15px; color: var(--muted);
  }
  .info b { color: var(--ink); font-weight: 600; }

  button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
    background: var(--fill); border: none;
    border-radius: 980px; padding: 8px 16px; cursor: pointer; margin: 0 6px 8px 0;
    transition: background .15s, transform .1s;
  }
  button:hover { background: var(--fill-hover); }
  button:active { transform: scale(0.97); }
  .presets { margin-top: 14px; }

  .btn-main {
    width: 100%; margin: 14px 0 0; padding: 12px 20px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 500;
  }
  .btn-main:hover { background: var(--accent); filter: brightness(1.1); }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row2 label { margin-bottom: 0; }
  .row2 input { padding: 10px 8px; }

  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 6px 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td input[type="number"] { width: 68px; padding: 6px 8px; font-size: 15px; border-radius: 10px; }
  .del { margin: 0; width: 28px; height: 28px; padding: 0; line-height: 1; font-size: 17px; color: var(--muted); }
  .del:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 15px; padding: 4px 0; }
  .total { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .total b { color: var(--ink); font-weight: 600; }

  .view-title { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-family: inherit; font-size: 13px; }
</style>
</head>
<body>

<nav class="nav">
  <b>Раскладка груза</b>
  <span>Шаг 2</span>
</nav>

<header class="hero">
  <h1>Сколько места займет груз.</h1>
  <p class="lead">Задай размеры кузова, добавь груз и посмотри, как он ляжет.</p>
</header>

<main>
  <div class="col">
  <section>
    <h2>Кузов</h2>
    <label>Длина
      <span class="field"><input id="len" type="number" min="50" max="2000" step="1" value="1360"><span class="unit">см</span></span>
    </label>
    <label>Ширина
      <span class="field"><input id="wid" type="number" min="50" max="400" step="1" value="245"><span class="unit">см</span></span>
    </label>
    <label>Высота
      <span class="field"><input id="hei" type="number" min="50" max="400" step="1" value="250"><span class="unit">см</span></span>
    </label>

    <div class="presets">
      <button type="button" data-l="1360" data-w="245" data-h="250">Фура 82 м³</button>
      <button type="button" data-l="620" data-w="245" data-h="250">Еврофура 20 т</button>
      <button type="button" data-l="420" data-w="205" data-h="210">Газель</button>
    </div>

    <div class="info">
      Объем кузова: <b id="vol">0</b> м³<br>
      Площадь пола: <b id="area">0</b> м²
    </div>
  </section>

  <section>
    <h2>Добавить груз</h2>
    <label>Название
      <span class="field"><input id="c-name" type="text" placeholder="Например, паллета"></span>
    </label>
    <div class="row2">
      <label>Длина, см<span class="field"><input id="c-l" type="number" min="1" step="1" value="120"></span></label>
      <label>Ширина, см<span class="field"><input id="c-w" type="number" min="1" step="1" value="80"></span></label>
      <label>Высота, см<span class="field"><input id="c-h" type="number" min="1" step="1" value="150"></span></label>
    </div>
    <label style="margin-top:10px">Количество
      <span class="field"><input id="c-q" type="number" min="1" step="1" value="1"><span class="unit">шт</span></span>
    </label>
    <button type="button" id="add" class="btn-main">Добавить груз</button>
    <div class="err" id="err" role="alert"></div>
  </section>
  </div>

  <section>
    <p class="view-title">Вид сверху</p>
    <svg id="top" viewBox="0 0 900 300" role="img" aria-label="Кузов, вид сверху"></svg>
  </section>

  <section>
    <h2>Груз</h2>
    <div class="tbl-wrap" id="tbl"></div>
    <div class="total" id="total"></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("top");
  var NS = "http://www.w3.org/2000/svg";

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function read() {
    return {
      l: Math.max(1, +$("len").value || 0),
      w: Math.max(1, +$("wid").value || 0),
      h: Math.max(1, +$("hei").value || 0)
    };
  }

  function drawTop(d) {
    // рамка под подписи размеров
    var padL = 50, padR = 20, padT = 40, padB = 50;
    var maxW = 900 - padL - padR;
    var maxH = 420;
    var scale = Math.min(maxW / d.l, maxH / d.w);
    var pw = d.l * scale, ph = d.w * scale;
    var vbW = 900, vbH = padT + ph + padB;

    svg.setAttribute("viewBox", "0 0 " + vbW + " " + vbH);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var x0 = padL, y0 = padT;

    // сетка каждые 100 см
    var grid = el("g", { stroke: "var(--grid)", "stroke-width": 1 });
    for (var gx = 100; gx < d.l; gx += 100) {
      grid.appendChild(el("line", { x1: x0 + gx * scale, y1: y0, x2: x0 + gx * scale, y2: y0 + ph }));
    }
    for (var gy = 100; gy < d.w; gy += 100) {
      grid.appendChild(el("line", { x1: x0, y1: y0 + gy * scale, x2: x0 + pw, y2: y0 + gy * scale }));
    }

    svg.appendChild(el("rect", { x: x0, y: y0, width: pw, height: ph, rx: 12, fill: "var(--body-fill)" }));
    svg.appendChild(grid);
    svg.appendChild(el("rect", {
      x: x0, y: y0, width: pw, height: ph, rx: 12,
      fill: "none", stroke: "var(--muted)", "stroke-width": 1.5
    }));

    // метка двери (задняя сторона справа)
    svg.appendChild(el("line", {
      x1: x0 + pw, y1: y0 + 6, x2: x0 + pw, y2: y0 + ph - 6,
      stroke: "var(--accent)", "stroke-width": 4, "stroke-linecap": "round"
    }));
    svg.appendChild(el("text", { x: x0 + pw, y: y0 - 10, "text-anchor": "end" }, "Двери"));
    svg.appendChild(el("text", { x: x0, y: y0 - 10 }, "Кабина"));

    // размер: длина
    var ly = y0 + ph + 26;
    svg.appendChild(el("line", { x1: x0, y1: ly, x2: x0 + pw, y2: ly, stroke: "var(--muted)" }));
    svg.appendChild(el("line", { x1: x0, y1: ly - 5, x2: x0, y2: ly + 5, stroke: "var(--muted)" }));
    svg.appendChild(el("line", { x1: x0 + pw, y1: ly - 5, x2: x0 + pw, y2: ly + 5, stroke: "var(--muted)" }));
    svg.appendChild(el("text", { x: x0 + pw / 2, y: ly + 18, "text-anchor": "middle" }, "Длина " + d.l + " см"));

    // размер: ширина
    var lx = x0 - 18;
    svg.appendChild(el("line", { x1: lx, y1: y0, x2: lx, y2: y0 + ph, stroke: "var(--muted)" }));
    svg.appendChild(el("line", { x1: lx - 5, y1: y0, x2: lx + 5, y2: y0, stroke: "var(--muted)" }));
    svg.appendChild(el("line", { x1: lx - 5, y1: y0 + ph, x2: lx + 5, y2: y0 + ph, stroke: "var(--muted)" }));
    var t = el("text", {
      x: lx - 8, y: y0 + ph / 2, "text-anchor": "middle",
      transform: "rotate(-90 " + (lx - 8) + " " + (y0 + ph / 2) + ")"
    }, "Ширина " + d.w + " см");
    svg.appendChild(t);
  }

  function update() {
    var d = read();
    $("vol").textContent = (d.l * d.w * d.h / 1e6).toFixed(1);
    $("area").textContent = (d.l * d.w / 1e4).toFixed(1);
    drawTop(d);
  }

  ["len", "wid", "hei"].forEach(function (id) {
    $(id).addEventListener("input", update);
  });

  document.querySelectorAll("button[data-l]").forEach(function (b) {
    b.addEventListener("click", function () {
      $("len").value = b.dataset.l;
      $("wid").value = b.dataset.w;
      $("hei").value = b.dataset.h;
      update();
    });
  });

  // ---------- груз ----------
  var cargo = [];
  var nextId = 1;

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderCargo() {
    var box = $("tbl");
    if (!cargo.length) {
      box.innerHTML = '<div class="empty">Груза пока нет. Заполни форму слева и нажми "Добавить груз".</div>';
      $("total").innerHTML = "";
      return;
    }
    var html = '<table><thead><tr><th>Груз</th><th>Д×Ш×В, см</th><th>Шт</th><th>м³</th><th></th></tr></thead><tbody>';
    var totalVol = 0, totalQty = 0;
    cargo.forEach(function (c) {
      var vol = c.l * c.w * c.h * c.q / 1e6;
      totalVol += vol; totalQty += c.q;
      html += '<tr>' +
        '<td>' + esc(c.name) + '</td>' +
        '<td>' + c.l + '×' + c.w + '×' + c.h + '</td>' +
        '<td><input type="number" min="1" step="1" value="' + c.q + '" data-id="' + c.id + '" aria-label="Количество"></td>' +
        '<td>' + vol.toFixed(2) + '</td>' +
        '<td><button type="button" class="del" data-del="' + c.id + '" aria-label="Удалить">×</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;

    var d = read();
    var bodyVol = d.l * d.w * d.h / 1e6;
    $("total").innerHTML = 'Всего мест: <b>' + totalQty + '</b><br>' +
      'Объем груза: <b>' + totalVol.toFixed(2) + '</b> м³ из ' + bodyVol.toFixed(1) + ' м³ (' +
      (totalVol / bodyVol * 100).toFixed(0) + '%)';
  }

  $("add").addEventListener("click", function () {
    var l = Math.round(+$("c-l").value), w = Math.round(+$("c-w").value),
        h = Math.round(+$("c-h").value), q = Math.round(+$("c-q").value);
    if (!(l > 0 && w > 0 && h > 0)) { $("err").textContent = "Укажи длину, ширину и высоту больше нуля."; return; }
    if (!(q >= 1)) { $("err").textContent = "Количество должно быть не меньше 1."; return; }
    $("err").textContent = "";
    var name = $("c-name").value.trim() || ("Груз " + nextId);
    cargo.push({ id: nextId++, name: name, l: l, w: w, h: h, q: q });
    $("c-name").value = "";
    renderCargo();
  });

  $("tbl").addEventListener("input", function (e) {
    var id = e.target.getAttribute("data-id");
    if (!id) return;
    var v = Math.round(+e.target.value);
    if (!(v >= 1)) return;
    cargo.forEach(function (c) { if (c.id === +id) c.q = v; });
    renderCargo();
    var again = document.querySelector('input[data-id="' + id + '"]');
    if (again) { again.focus(); again.setSelectionRange && again.type !== "number" && again.setSelectionRange(99, 99); }
  });

  $("tbl").addEventListener("click", function (e) {
    var id = e.target.getAttribute("data-del");
    if (!id) return;
    cargo = cargo.filter(function (c) { return c.id !== +id; });
    renderCargo();
  });

  ["len", "wid", "hei"].forEach(function (id) {
    $(id).addEventListener("input", renderCargo);
  });
  document.querySelectorAll("button[data-l]").forEach(function (b) {
    b.addEventListener("click", renderCargo);
  });

  update();
  renderCargo();
})();
</script>
</body>
</html>

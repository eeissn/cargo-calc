<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Раскладка груза в кузове</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sofia+Sans+Extra+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #151413;
    --card: #1d1c1a;
    --ink: #ece6d3;
    --cream: #f9e8ac;
    --muted: #9b9484;
    --line: rgba(249, 232, 172, 0.1);
    --fill: rgba(249, 232, 172, 0.06);
    --fill-hover: rgba(249, 232, 172, 0.12);
    --red: #c2433c;
    --accent: #e0584f;
    --danger: #ff6a5a;
    --olive: #8a8120;
    --select: #ffffff;
    --body-fill: #191816;
    --grid: rgba(249, 232, 172, 0.08);
    --frame: #7d7767;
    --display: "Sofia Sans Extra Condensed", "Fira Sans Extra Condensed", "Arial Narrow", Impact, sans-serif;
    --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  /* зерно, как на бумаге в брендбуке */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0.07; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .8  0 0 0 0 .8  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* верхняя панель */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 60px; padding: 0 24px;
    background: rgba(21, 20, 19, 0.78); border-bottom: 1px solid var(--line);
    -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--red); }
  .logo { font: 900 30px/1 var(--display); letter-spacing: 0.01em; text-transform: lowercase; color: var(--cream); }
  .badge { padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--fill); }
  .seg button { margin: 0; padding: 6px 20px; border: 0; border-radius: 999px; background: transparent; font: 600 13px var(--sans); color: var(--muted); }
  .seg button:hover { color: var(--ink); background: transparent; }
  .seg button.on, .seg button.on:hover { background: var(--cream); color: #151413; }

  main {
    display: grid; grid-template-columns: 300px 1fr 400px; gap: 16px; align-items: start;
    max-width: 1560px; margin: 0 auto; padding: 20px 24px 48px;
  }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; padding: 14px 12px 32px; }
    .bar { padding: 0 14px; }
  }
  .col { display: grid; gap: 16px; }
  section { margin: 0; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }

  h2, .view-title {
    margin: 0 0 16px; font: 500 12px/1.2 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--cream);
  }

  label { display: block; margin-bottom: 12px; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  input[type="number"], input[type="text"] {
    width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; background: var(--fill);
    font: 500 15px var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder { color: var(--muted); opacity: 0.7; font-weight: 400; }
  input:focus { outline: none; border-color: rgba(249, 232, 172, 0.55); background: var(--fill-hover); box-shadow: 0 0 0 3px rgba(249, 232, 172, 0.12); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
  .unit { min-width: 24px; font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }

  .info { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .info b { color: var(--ink); font-weight: 600; }

  button {
    margin: 0 6px 6px 0; padding: 8px 14px; border: 1px solid transparent; border-radius: 10px; background: var(--fill);
    font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  button:hover { background: var(--fill-hover); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:disabled:hover { background: var(--fill); }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .presets button { margin: 0; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; }

  .btn-main {
    display: block; width: 100%; margin: 16px 0 0; padding: 13px 20px; border: 0; border-radius: 12px;
    background: var(--red); color: #fff7e0; font: 600 14px var(--sans); text-align: center;
  }
  .btn-main:hover { background: #d24d45; }
  .err { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--danger); }

  .types { display: flex; gap: 6px; margin-bottom: 16px; }
  .types button { display: grid; place-items: center; width: 46px; height: 46px; margin: 0; padding: 0; border-radius: 12px; color: var(--muted); }
  .types button:hover { color: var(--ink); }
  .types button.on { border-color: var(--cream); background: rgba(249, 232, 172, 0.12); color: var(--cream); }
  .lbl { margin-bottom: 8px; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .lbl b { color: var(--cream); font-weight: 600; }
  .pk-i { display: block; width: 24px; height: 24px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .row2 label { margin-bottom: 0; }
  .row2 input { padding: 10px 8px; }

  .viewbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .viewbar .view-title { margin: 0 auto 0 0; }
  .viewbar button { margin: 0; }
  .rot-msg { font-size: 12.5px; color: var(--danger); }

  .canvas { padding: 12px 12px 2px; border: 1px solid var(--line); border-radius: 12px; background: #11100f; }
  #top { overflow: visible; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
  svg .unit { cursor: grab; touch-action: none; }

  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { padding: 0 4px 10px; text-align: left; font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  td { padding: 10px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td:nth-child(3) { font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; }
  td input[type="number"] { width: 58px; padding: 6px 8px; font-size: 14px; }
  .nm { font-weight: 600; color: var(--ink); }
  .sub { font-size: 12px; color: var(--muted); }
  .miss { margin-top: 2px; font-size: 12px; color: var(--danger); }
  .del { width: 28px; height: 28px; margin: 0; padding: 0; border-radius: 50%; background: transparent; font-size: 17px; line-height: 1; color: var(--muted); }
  .del:hover { background: var(--fill-hover); color: var(--danger); }
  .empty { padding: 4px 0; color: var(--muted); }
  .hint { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .total { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .total b { color: var(--ink); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .actions button { margin: 0; }
  #auto { background: var(--cream); color: #151413; font-weight: 600; }
  #auto:hover { background: #fff0bd; }
  #clear { background: transparent; color: var(--accent); }
  #clear:hover { background: var(--fill); }
  .autoinfo { margin-top: 10px; font: 400 12px var(--mono); color: var(--cream); }

  /* плитка груза: значок типа в цвете груза, ее же можно тянуть в кузов */
  .chip { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid transparent; border-radius: 10px; cursor: grab; touch-action: none; }
  .chip .pk-i { width: 22px; height: 22px; }
  .chip.off { opacity: 0.4; cursor: not-allowed; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; border-radius: 4px; opacity: 0.9; border: 2px solid #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
  .ghost.in { opacity: 0; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }

  .limrow { display: flex; align-items: center; gap: 4px; margin: 2px 0 0 -4px; font: 400 11px var(--mono); color: var(--accent); white-space: nowrap; }
  .lim { display: inline-grid; place-items: center; width: 22px; height: 22px; margin: 0; padding: 0; border-radius: 6px; background: transparent; color: var(--muted); opacity: 0.7; }
  .lim .pk-i { width: 14px; height: 14px; }
  .lim:hover { opacity: 1; color: var(--ink); background: var(--fill); }
  .lim.on { opacity: 1; color: var(--accent); }
  .limtr td { padding: 0 0 12px; }
  .limbox { padding: 12px 14px 6px; border-radius: 10px; background: var(--fill); }
  .limttl { margin-bottom: 10px; font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  label.opt { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 400 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); }
  label.opt input[type="radio"] { margin: 0; accent-color: var(--cream); }
  label.opt input[type="number"] { width: 60px; padding: 4px 8px; font-size: 13px; }
</style>


</head>
<body>

<header class="bar">
  <div class="brand">
    <i class="dot"></i>
    <span class="logo">раскладка груза</span>
    <span class="badge">блок D1</span>
  </div>
  <div class="seg" role="group" aria-label="Единицы измерения">
    <button type="button" data-u="cm" class="on" aria-pressed="true">см</button>
    <button type="button" data-u="m" aria-pressed="false">м</button>
  </div>
</header>

<main>
  <div class="col">
  <section id="sec-body">
    <h2>Кузов</h2>
    <label>Длина
      <span class="field"><input id="len" type="number" min="50" max="2000" step="1" value="1360"><span class="unit ulab">см</span></span>
    </label>
    <label>Ширина
      <span class="field"><input id="wid" type="number" min="50" max="400" step="1" value="245"><span class="unit ulab">см</span></span>
    </label>
    <label>Высота
      <span class="field"><input id="hei" type="number" min="50" max="400" step="1" value="250"><span class="unit ulab">см</span></span>
    </label>

    <div class="presets">
      <button type="button" data-l="1360" data-w="245" data-h="250">Еврофура 20 т, 82 м³</button>
      <button type="button" data-l="1360" data-w="245" data-h="270">Еврофура 20 т, 90 м³</button>
      <button type="button" data-l="423" data-w="213" data-h="216">Газель Next 4,2 м</button>
    </div>

    <div class="info">
      Объем кузова: <b id="vol">0</b> м³<br>
      Площадь пола: <b id="area">0</b> м²
    </div>
  </section>

  <section id="sec-cargo">
    <h2>Добавить груз</h2>
    <label>Название
      <span class="field"><input id="c-name" type="text" placeholder="Например, паллета"></span>
    </label>
    <div class="lbl">Тип упаковки: <b id="type-name">Паллета</b></div>
    <div class="types" id="types" role="radiogroup" aria-label="Тип упаковки"></div>
    <div class="row2">
      <label>Длина, <span class="ulab">см</span><span class="field"><input id="c-l" type="number" min="1" step="1" value="120"></span></label>
      <label>Ширина, <span class="ulab">см</span><span class="field"><input id="c-w" type="number" min="1" step="1" value="80"></span></label>
      <label>Высота, <span class="ulab">см</span><span class="field"><input id="c-h" type="number" min="1" step="1" value="150"></span></label>
    </div>
    <label style="margin-top:10px">Количество
      <span class="field"><input id="c-q" type="number" min="1" step="1" value="1"><span class="unit">шт</span></span>
    </label>
    <button type="button" id="add" class="btn-main">Добавить груз</button>
    <div class="err" id="err" role="alert"></div>
  </section>
  </div>

  <div class="col">
  <section id="sec-views">
    <div class="viewbar">
      <p class="view-title">Вид сверху</p>
      <span class="rot-msg" id="rot-msg" role="status"></span>
      <button type="button" id="rot" disabled>Повернуть (R)</button>
    </div>
    <div class="canvas"><svg id="top" viewBox="0 0 900 300" role="img" aria-label="Кузов, вид сверху"></svg></div>
  </section>

  <section>
    <p class="view-title">Вид сбоку: левый борт</p>
    <div class="canvas"><svg id="side-l" viewBox="0 0 900 300" role="img" aria-label="Кузов, левый борт"></svg></div>
  </section>

  <section>
    <p class="view-title">Вид сбоку: правый борт</p>
    <div class="canvas"><svg id="side-r" viewBox="0 0 900 300" role="img" aria-label="Кузов, правый борт"></svg></div>
  </section>
  </div>

  <section id="sec-total">
    <h2>Груз</h2>
    <div class="tbl-wrap" id="tbl"></div>
    <div class="total" id="total"></div>
    <div class="actions">
      <button type="button" id="auto">Разложить автоматически</button>
      <button type="button" id="clear">Убрать все из кузова</button>
    </div>
    <div class="autoinfo" id="autoinfo" role="status"></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("top");
  var NS = "http://www.w3.org/2000/svg";
  var VB_W = 900;

  var cargo = [];          // типы груза: {id, name, l, w, h, q}
  var units = [];          // отдельные места: {uid, cid, x, y, placed, out}
  var nextCid = 1, nextUid = 1;
  var geom = { x0: 50, y0: 40, scale: 1 };
  var drag = null;
  var selectedUid = null;
  var autoNote = "", autoSig = "";

  // типы упаковки: тонкие значки в одном стиле
  function ico(body) {
    return '<svg class="pk-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }
  var PACK_TYPES = [
    { id: "pallet", name: "Паллета", svg: ico('<rect x="5" y="3.5" width="14" height="9" rx="1"/><path d="M5 7.5h14"/><rect x="3" y="12.5" width="18" height="2.5"/><path d="M4.5 15h3v3.5h-3zM10.5 15h3v3.5h-3zM16.5 15h3v3.5h-3z"/><rect x="3" y="18.5" width="18" height="2"/>') },
    { id: "box", name: "Коробка", svg: ico('<path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>') },
    { id: "bag", name: "Мешок", svg: ico('<path d="M9.5 6.7 8.6 4.6 10.2 3h3.6l1.6 1.6-.9 2.1"/><path d="M14.5 6.7C17.8 8.2 19.5 11 19.5 14.2C19.5 18 16.6 20.5 12 20.5C7.4 20.5 4.5 18 4.5 14.2C4.5 11 6.2 8.2 9.5 6.7"/><path d="M9.5 6.7h5"/>') },
    { id: "barrel", name: "Бочка", svg: ico('<ellipse cx="12" cy="4.5" rx="5" ry="1.6"/><path d="M7 4.5C5.4 9 5.4 15.5 7 19.5M17 4.5c1.6 4.5 1.6 11 0 15M7 19.5c3 1.5 7 1.5 10 0"/><path d="M6 9c3.5 1.4 8.5 1.4 12 0M5.7 12.5c3.8 1.5 8.8 1.5 12.6 0M6 16c3.5 1.4 8.5 1.4 12 0"/>') },
    { id: "roll", name: "Рулон", svg: ico('<ellipse cx="8" cy="12" rx="3.5" ry="7"/><path d="M8 5h9c1.9 0 3.5 3.1 3.5 7s-1.6 7-3.5 7H8"/><ellipse cx="8" cy="12" rx="1" ry="2"/>') }
  ];
  PACK_TYPES.forEach(function (p) { p.body = p.svg.replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, ""); });
  var curType = "pallet";
  var openLimit = null;   // у какого груза открыта настройка ограничений
  var LAYERS_ICO = '<svg class="pk-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg>';
  function typeDef(id) {
    for (var i = 0; i < PACK_TYPES.length; i++) if (PACK_TYPES[i].id === id) return PACK_TYPES[i];
    return PACK_TYPES[0];
  }

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // единицы показа: внутри все хранится в сантиметрах
  var U = "cm";
  function toInput(cm) { return U === "m" ? String(+(cm / 100).toFixed(2)) : String(Math.round(cm)); }
  function fmtDim(cm) {
    return U === "m" ? String(+(cm / 100).toFixed(2)).replace(".", ",") + " м" : Math.round(cm) + " см";
  }
  function fmtNum(cm) {
    return U === "m" ? String(+(cm / 100).toFixed(2)).replace(".", ",") : String(Math.round(cm));
  }
  function cmOf(id) { return Math.round((+$(id).value || 0) * (U === "m" ? 100 : 1)); }
  function read() {
    var k = U === "m" ? 100 : 1;
    return {
      l: Math.max(1, Math.round((+$("len").value || 0) * k)),
      w: Math.max(1, Math.round((+$("wid").value || 0) * k)),
      h: Math.max(1, Math.round((+$("hei").value || 0) * k))
    };
  }
  function overlapArea(a, b) {
    var da = dimsOf(a), db = dimsOf(b);
    var w = Math.min(a.x + da.l, b.x + db.l) - Math.max(a.x, b.x);
    var h = Math.min(a.y + da.w, b.y + db.w) - Math.max(a.y, b.y);
    return (w > 0 && h > 0) ? w * h : 0;
  }
  function topOf(u) { return (u.z || 0) + cargoById(u.cid).h; }

  function selectedUnit() {
    for (var i = 0; i < units.length; i++) {
      if (units[i].uid === selectedUid && units[i].placed) return units[i];
    }
    return null;
  }
  function cargoById(id) {
    for (var i = 0; i < cargo.length; i++) if (cargo[i].id === id) return cargo[i];
    return null;
  }
  // краски: крем, красный, олива, бумага, ржавчина, шалфей, сирень
  var PALETTE = [
    { f: "#f9e8ac", l: "#fff4cb", s: "#b9a85d", t: "#151413" },
    { f: "#d9534a", l: "#ea7a71", s: "#8e2a24", t: "#ffffff" },
    { f: "#a8a02e", l: "#c4bc4a", s: "#6a6410", t: "#151413" },
    { f: "#ede9e1", l: "#faf8f3", s: "#9a958a", t: "#151413" },
    { f: "#dd8b4c", l: "#eba676", s: "#8e5424", t: "#151413" },
    { f: "#8fa58b", l: "#adc2a9", s: "#4d6449", t: "#151413" },
    { f: "#b7a0c0", l: "#cfbbd6", s: "#6e5a77", t: "#151413" }
  ];
  function colorOf(c) { return PALETTE[(c.id - 1) % PALETTE.length]; }
  function fits(c, d) {
    return c.h <= d.h && ((c.l <= d.l && c.w <= d.w) || (c.w <= d.l && c.l <= d.w));
  }

          '<div class="limttl">Что можно ставить сверху</div>' +
          '<label class="opt"><input type="radio" name="lim-' + c.id + '" value="free" data-limid="' + c.id + '"' + (mode === 'free' ? ' checked' : '') + '> Без ограничений</label>' +
          '<label class="opt"><input type="radio" name="lim-' + c.id + '" value="none" data-limid="' + c.id + '"' + (mode === 'none' ? ' checked' : '') + '> Нельзя ставить сверху</label>' +
          '<label class="opt"><input type="radio" name="lim-' + c.id + '" value="max" data-limid="' + c.id + '"' + (mode === 'max' ? ' checked' : '') + '> Сверху не более ' +
          '<input type="number" min="1" step="1" class="limn" data-limn="' + c.id + '" value="' + (c.limit > 0 ? c.limit : 5) + '" aria-label="Сколько мест сверху"> мест</label>' +
          '</div></td></tr>';
      }
    });
    html += '</tbody></table>';
    box.innerHTML = html;

    var bodyVol = d.l * d.w * d.h / 1e6, placedN = 0, floor = 0, vol = 0;
    units.forEach(function (u) {
      if (!u.placed) return;
      var c = cargoById(u.cid);
      placedN++; if (!(u.z > 0)) floor += c.l * c.w; vol += c.l * c.w * c.h / 1e6;
    });
    var ov = Object.keys(findOverlaps()).length;
    var stk = computeStacks().stacks.filter(function (s) { return s.units.length > 1; });
    var tall = null;
    stk.forEach(function (s) { if (!tall || s.top > tall.top) tall = s; });
    $("total").innerHTML = 'В кузове: <b>' + placedN + '</b> из ' + totalQty + ' мест<br>' +
      'Занято пола: <b>' + (floor / (d.l * d.w) * 100).toFixed(0) + '%</b><br>' +
      (stk.length ? 'Штабелей: <b>' + stk.length + '</b>, самый высокий: <b>' + fmtDim(tall.top) + '</b> (' + tall.units.length + ' ' + plural(tall.units.length, 'место', 'места', 'мест') + ')<br>' : '') +
      'Объем груза в кузове: <b>' + vol.toFixed(2) + '</b> м³ из ' + bodyVol.toFixed(1) + ' м³ (' +
      (vol / bodyVol * 100).toFixed(0) + '%)' +
      (ov ? '<br><span class="miss">Наложения: ' + ov + ' мест лежат друг на друге</span>' : '');
  }

  function update(noFit) {
    var d = read();
    $("vol").textContent = (d.l * d.w * d.h / 1e6).toFixed(1);
    $("area").textContent = (d.l * d.w / 1e4).toFixed(1);
    syncUnits();
    if (!noFit) fitUnits(d);
    settle();
    if (selectedUid !== null && !selectedUnit()) selectedUid = null;
    $("rot").disabled = !selectedUnit();
    drawTop(d);
    renderCargo(d);
    renderAutoNote();
  }

  // ---------- перетаскивание ----------
  function toCm(cx, cy) {
    var pt = svg.createSVGPoint();
    pt.x = cx; pt.y = cy;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: (p.x - geom.x0) / geom.scale, y: (p.y - geom.y0) / geom.scale };
  }
  function isInside(p, d) { return p.x >= 0 && p.x <= d.l && p.y >= 0 && p.y <= d.w; }
  function pxPerCm() { return svg.getBoundingClientRect().width / VB_W * geom.scale; }

  // притяжение к стенкам и к краям другого груза
  function snapPos(dm, nx, ny, d, selfUid) {
    var thr = 14 / Math.max(pxPerCm(), 0.05);
    var others = units.filter(function (o) { return o.placed && !o.out && o.uid !== selfUid; });
    var gx = null, gy = null, bx = nx, by = ny, best;

    best = null;
    function tryX(v, guide) {
      var dist = Math.abs(v - nx);
      if (dist <= thr && (best === null || dist < best)) { best = dist; bx = v; gx = guide; }
    }
    tryX(0, 0); tryX(d.l - dm.l, d.l);
    others.forEach(function (o) {
      var od = dimsOf(o);
      if (ny < o.y + od.w + thr && ny + dm.w > o.y - thr) {
        tryX(o.x + od.l, o.x + od.l);
        tryX(o.x - dm.l, o.x);
        tryX(o.x, o.x);
        tryX(o.x + od.l - dm.l, o.x + od.l);
      }
    });

    best = null;
    function tryY(v, guide) {
      var dist = Math.abs(v - ny);
      if (dist <= thr && (best === null || dist < best)) { best = dist; by = v; gy = guide; }
    }
    tryY(0, 0); tryY(d.w - dm.w, d.w);
    others.forEach(function (o) {
      var od = dimsOf(o);
      if (bx < o.x + od.l + thr && bx + dm.l > o.x - thr) {
        tryY(o.y + od.w, o.y + od.w);
        tryY(o.y - dm.w, o.y);
        tryY(o.y, o.y);
        tryY(o.y + od.w - dm.w, o.y + od.w);
      }
    });

    return {
      x: Math.round(clamp(bx, 0, d.l - dm.l)), y: Math.round(clamp(by, 0, d.w - dm.w)),
      gx: gx, gy: gy
    };
  }

  // если груз лег на другой, сдвигаем его к ближайшей свободной стороне
  function resolve(u, d) {
    var dm = dimsOf(u);
    for (var it = 0; it < 10; it++) {
      var hit = null;
      for (var i = 0; i < units.length; i++) {
        var o = units[i];
        if (o === u || !o.placed || o.out) continue;
        var od = dimsOf(o);
        if (u.x < o.x + od.l - 0.01 && o.x < u.x + dm.l - 0.01 &&
            u.y < o.y + od.w - 0.01 && o.y < u.y + dm.w - 0.01 &&
            (u.z || 0) < topOf(o) - 0.01 && (o.z || 0) < topOf(u) - 0.01) { hit = o; break; }
      }
      if (!hit) return;
      var hd = dimsOf(hit);
      var opts = [
        { x: hit.x - dm.l, y: u.y, cost: u.x + dm.l - hit.x },
        { x: hit.x + hd.l, y: u.y, cost: hit.x + hd.l - u.x },
        { x: u.x, y: hit.y - dm.w, cost: u.y + dm.w - hit.y },
        { x: u.x, y: hit.y + hd.w, cost: hit.y + hd.w - u.y }
      ].filter(function (o) {
        return o.x >= 0 && o.y >= 0 && o.x + dm.l <= d.l && o.y + dm.w <= d.w;
      }).sort(function (a, b) { return a.cost - b.cost; });
      if (!opts.length) return;
      u.x = opts[0].x; u.y = opts[0].y;
    }
  }

  // на какой высоте встанет груз: на пол или сверху на другой груз
  function placeZ(u, d) {
    var c = cargoById(u.cid), dm = dimsOf(u), below = [], z = 0;
    for (var i = 0; i < units.length; i++) {
      var o = units[i];
      if (o === u || !o.placed || o.out) continue;
      if (overlapArea(u, o) > 0.5) below.push(o);
    }
    if (!below.length) return { z: 0, ok: true };
    below.forEach(function (b) { z = Math.max(z, topOf(b)); });
    var sup = 0;
    below.forEach(function (b) { if (Math.abs(topOf(b) - z) < 0.5) sup += overlapArea(u, b); });
    if (z + c.h > d.h) return { z: 0, ok: false, reason: "height" };
    if (sup < 0.5 * dm.l * dm.w) return { z: 0, ok: false, reason: "support" };
    return { z: z, ok: true };
  }

  // груз отпустили: ставим сверху, если можно, иначе сдвигаем в сторону
  function finalize(u, d) {
    var r = placeZ(u, d);
    if (r.ok) { u.z = r.z; return; }
    flash(r.reason === "height"
      ? "Сверху не хватает высоты, груз лег рядом"
      : "Опора меньше половины груза, поэтому он лег рядом");
    u.z = 0;
    resolve(u, d);
    var r2 = placeZ(u, d);
    u.z = r2.ok ? r2.z : 0;
  }

  // сила тяжести: если из-под груза убрали опору, он опускается
  function settle() {
    var pl = units.filter(function (u) { return u.placed && !u.out; })
      .sort(function (a, b) { return (a.z || 0) - (b.z || 0) || a.uid - b.uid; });
    var z0 = {};
    pl.forEach(function (u) { z0[u.uid] = u.z || 0; });
    pl.forEach(function (u) {
      var z = 0;
      pl.forEach(function (o) {
        if (o !== u && z0[o.uid] < z0[u.uid] - 0.01 && overlapArea(u, o) > 0.5) z = Math.max(z, topOf(o));
      });
      u.z = z;
    });
  }

  // позиция для груза, брошенного из таблицы: центр под курсором, затем притяжение
  function newPos(p, c, d) {
    var rot = !(c.l <= d.l && c.w <= d.w);
    var dm = rot ? { l: c.w, w: c.l } : { l: c.l, w: c.w };
    var pos = snapPos(dm,
      clamp(p.x - dm.l / 2, 0, d.l - dm.l), clamp(p.y - dm.w / 2, 0, d.w - dm.w), d, -1);
    pos.rot = rot;
    return pos;
  }

  function moveGhost(e) {
    var c = cargoById(drag.cid), k = pxPerCm();
    var gw = Math.max(c.l * k, 20), gh = Math.max(c.w * k, 16);
    var g = drag.ghost;
    g.style.width = gw + "px"; g.style.height = gh + "px";
    g.style.left = (e.clientX - gw / 2) + "px"; g.style.top = (e.clientY - gh / 2) + "px";
    g.classList.toggle("in", isInside(toCm(e.clientX, e.clientY), read()));
  }

  function startNew(cid, e) {
    var c = cargoById(cid);
    e.preventDefault();
    var g = document.createElement("div");
    g.className = "ghost";
    g.style.background = colorOf(c).f + "40";
    g.style.borderColor = colorOf(c).f;
    document.body.appendChild(g);
    document.body.classList.add("dragging");
    drag = { type: "new", cid: cid, ghost: g };
    moveGhost(e);
  }

  function startUnit(uid, e) {
    var u = null;
    for (var i = 0; i < units.length; i++) if (units[i].uid === uid) u = units[i];
    if (!u) return;
    e.preventDefault();
    selectedUid = uid;
    units.splice(units.indexOf(u), 1);
    units.push(u);                       // поднять наверх
    var p = toCm(e.clientX, e.clientY);
    drag = { type: "unit", u: u, gx: p.x - u.x, gy: p.y - u.y };
    document.body.classList.add("dragging");
  }

  window.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var d = read(), p = toCm(e.clientX, e.clientY);
    if (drag.type === "new") {
      moveGhost(e);
      if (isInside(p, d)) {
        var np = newPos(p, cargoById(drag.cid), d);
        drag.preview = { cid: drag.cid, x: np.x, y: np.y, rot: np.rot };
        drag.guides = { gx: np.gx, gy: np.gy };
      } else {
        drag.preview = null; drag.guides = null;
      }
      drawTop(d);
      return;
    }
    var dm = dimsOf(drag.u), nx = p.x - drag.gx, ny = p.y - drag.gy;
    if (isInside(p, d)) {
      drag.u.out = false;
      var pos = snapPos(dm, clamp(nx, 0, d.l - dm.l), clamp(ny, 0, d.w - dm.w), d, drag.u.uid);
      nx = pos.x; ny = pos.y;
      drag.guides = { gx: pos.gx, gy: pos.gy };
    } else {
      drag.u.out = true;
      drag.guides = null;
    }
    drag.u.x = Math.round(nx); drag.u.y = Math.round(ny);
    if (drag.u.out) { drag.u.z = 0; } else { var r = placeZ(drag.u, d); drag.u.z = r.ok ? r.z : 0; }
    drawTop(d);
  });

  function finishDrag(e, cancel) {
    if (!drag) return;
    var d = read(), p = toCm(e.clientX, e.clientY), inside = !cancel && isInside(p, d);
    if (drag.type === "new") {
      var c = cargoById(drag.cid);
      if (inside) {
        var u = null;
        for (var i = 0; i < units.length; i++) {
          if (units[i].cid === drag.cid && !units[i].placed) { u = units[i]; break; }
        }
        if (u) {
          var np = newPos(p, c, d);
          u.placed = true; u.out = false; u.rot = np.rot; u.x = np.x; u.y = np.y;
          units.splice(units.indexOf(u), 1); units.push(u);
          finalize(u, d);
        }
      }
      document.body.removeChild(drag.ghost);
    } else {
      drag.u.out = false;
      if (!inside) { drag.u.placed = false; drag.u.z = 0; } else { finalize(drag.u, d); }
    }
    document.body.classList.remove("dragging");
    drag = null;
    update(false);
  }
  window.addEventListener("pointerup", function (e) { finishDrag(e, false); });
  window.addEventListener("pointercancel", function (e) { finishDrag(e, true); });

  svg.addEventListener("pointerdown", function (e) {
    var t = e.target;
    while (t && t !== svg && !(t.getAttribute && t.getAttribute("data-uid"))) t = t.parentNode;
    if (!t || t === svg) {
      if (selectedUid !== null) { selectedUid = null; update(true); }
      return;
    }
    startUnit(+t.getAttribute("data-uid"), e);
  });

  // ---------- события формы и таблицы ----------
  ["len", "wid", "hei"].forEach(function (id) {
    $(id).addEventListener("input", function () { update(true); });
    $(id).addEventListener("change", function () { update(false); });
  });

  document.querySelectorAll("button[data-l]").forEach(function (b) {
    b.addEventListener("click", function () {
      $("len").value = toInput(+b.dataset.l);
      $("wid").value = toInput(+b.dataset.w);
      $("hei").value = toInput(+b.dataset.h);
      update(false);
    });
  });

  $("add").addEventListener("click", function () {
    var l = cmOf("c-l"), w = cmOf("c-w"), h = cmOf("c-h"), q = Math.round(+$("c-q").value);
    if (!(l > 0 && w > 0 && h > 0)) { $("err").textContent = "Укажи длину, ширину и высоту больше нуля."; return; }
    if (!(q >= 1)) { $("err").textContent = "Количество должно быть не меньше 1."; return; }
    $("err").textContent = "";
    var name = $("c-name").value.trim() || (typeDef(curType).name + " " + nextCid);
    cargo.push({ id: nextCid++, name: name, type: curType, l: l, w: w, h: h, q: q, limit: null });
    $("c-name").value = "";
    update(false);
  });

  $("tbl").addEventListener("pointerdown", function (e) {
    var chip = e.target.closest ? e.target.closest("[data-chip]") : null;
    if (chip) startNew(+chip.getAttribute("data-chip"), e);
  });

  $("tbl").addEventListener("change", function (e) {
    var lid = e.target.getAttribute("data-limid"), ln = e.target.getAttribute("data-limn");
    if (lid || ln) {
      var lc = cargoById(+(lid || ln));
      if (lc) {
        if (ln) lc.limit = Math.max(1, Math.round(+e.target.value) || 1);
        else if (e.target.value === "free") lc.limit = null;
        else if (e.target.value === "none") lc.limit = 0;
        else lc.limit = lc.limit > 0 ? lc.limit : 5;
      }
      update(false);
      return;
    }
    var id = e.target.getAttribute("data-id");
    if (!id) return;
    var v = Math.round(+e.target.value);
    if (!(v >= 1)) { update(false); return; }
    cargo.forEach(function (c) { if (c.id === +id) c.q = v; });
    update(false);
  });

  $("tbl").addEventListener("click", function (e) {
    var lb = e.target.closest ? e.target.closest("button[data-lim]") : null;
    if (lb) {
      var lcid = +lb.getAttribute("data-lim");
      openLimit = openLimit === lcid ? null : lcid;
      update(false);
      return;
    }
    var id = e.target.getAttribute("data-del");
    if (!id) return;
    cargo = cargo.filter(function (c) { return c.id !== +id; });
    update(false);
  });

  // ---------- умная автораскладка ----------
  function sigNow() {
    return units.filter(function (u) { return u.placed; }).map(function (u) {
      return u.uid + ":" + u.x + ":" + u.y + ":" + (u.rot ? 1 : 0) + ":" + (u.z || 0);
    }).sort().join("|");
  }
  function renderAutoNote() {
    $("autoinfo").textContent = (autoNote && autoSig === sigNow()) ? autoNote : "";
  }

  function dimsRot(c, rot) { return rot ? { l: c.w, w: c.l } : { l: c.l, w: c.w }; }

  // колонки поперек кузова (swap = false) или ряды вдоль кузова (swap = true)
  function shelfPack(items, rotOf, d, swap) {
    var res = [], x = 0, y = 0, run = 0;
    items.forEach(function (it) {
      var r = rotOf(it), dm = dimsRot(it.c, r);
      if (!swap) {
        if (y + dm.w > d.w) { x += run; y = 0; run = 0; }
        if (x + dm.l > d.l) return;
        res.push({ u: it.u, units: it.units, x: x, y: y, rot: r });
        y += dm.w; run = Math.max(run, dm.l);
      } else {
        if (x + dm.l > d.l) { y += run; x = 0; run = 0; }
        if (y + dm.w > d.w) return;
        res.push({ u: it.u, units: it.units, x: x, y: y, rot: r });
        x += dm.l; run = Math.max(run, dm.w);
      }
    });
    return res;
  }

  function splitFree(free, px, py, pw, ph) {
    var out = [];
    free.forEach(function (f) {
      if (px >= f.x + f.w || px + pw <= f.x || py >= f.y + f.h || py + ph <= f.y) { out.push(f); return; }
      if (px > f.x) out.push({ x: f.x, y: f.y, w: px - f.x, h: f.h });
      if (px + pw < f.x + f.w) out.push({ x: px + pw, y: f.y, w: f.x + f.w - px - pw, h: f.h });
      if (py > f.y) out.push({ x: f.x, y: f.y, w: f.w, h: py - f.y });
      if (py + ph < f.y + f.h) out.push({ x: f.x, y: py + ph, w: f.w, h: f.y + f.h - py - ph });
    });
    function inside(a, b) { return a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h; }
    return out.filter(function (a, i) {
      return !out.some(function (b, j) { return i !== j && inside(a, b) && (!inside(b, a) || j < i); });
    });
  }

  // свободные прямоугольники: каждое место ставим в лучший угол, поворачивая при необходимости
  function maxRectsPack(items, d) {
    var free = [{ x: 0, y: 0, w: d.l, h: d.w }], res = [];
    items.forEach(function (it) {
      var best = null;
      free.forEach(function (f) {
        [false, true].forEach(function (r) {
          if (r ? !it.rOk : !it.nOk) return;
          var dm = dimsRot(it.c, r);
          if (dm.l > f.w || dm.w > f.h) return;
          var s1 = Math.min(f.w - dm.l, f.h - dm.w), s2 = Math.max(f.w - dm.l, f.h - dm.w);
          if (!best || s1 < best.s1 || (s1 === best.s1 && s2 < best.s2)) {
            best = { x: f.x, y: f.y, w: dm.l, h: dm.w, r: r, s1: s1, s2: s2 };
          }
        });
      });
      if (!best) return;
      res.push({ u: it.u, units: it.units, x: best.x, y: best.y, rot: best.r });
      free = splitFree(free, best.x, best.y, best.w, best.h);
    });
    return res;
  }

  function scoreOf(pl) {
    var vol = 0, len = 0, rotN = 0, n = 0, lv = 1;
    pl.forEach(function (p) {
      var c = cargoById(p.u.cid), dm = dimsRot(c, p.rot), k = p.units.length;
      vol += dm.l * dm.w * c.h * k;
      len = Math.max(len, p.x + dm.l);
      if (p.rot) rotN += k;
      n += k; lv = Math.max(lv, k);
    });
    return { vol: vol, len: len, rotN: rotN, n: n, lv: lv };
  }
  // лучше: больше уложенный объем, затем короче занятая длина, затем меньше поворотов
  function isBetter(a, b) {
    if (!b) return true;
    if (a.vol !== b.vol) return a.vol > b.vol;
    if (a.len !== b.len) return a.len < b.len;
    return a.rotN < b.rotN;
  }

  // лучшая укладка "башен" на пол: башня - несколько одинаковых мест друг на друге
  function packTowers(towers, d) {
    var orders = [
      function (a, b) { return a.u.uid - b.u.uid; },
      function (a, b) { return b.c.l * b.c.w - a.c.l * a.c.w || a.u.uid - b.u.uid; },
      function (a, b) { return Math.max(b.c.l, b.c.w) - Math.max(a.c.l, a.c.w) || a.u.uid - b.u.uid; },
      function (a, b) { return Math.min(b.c.l, b.c.w) - Math.min(a.c.l, a.c.w) || a.u.uid - b.u.uid; }
    ];

    // какие типы груза можно класть и так и так
    var flex = [], seen = {};
    towers.forEach(function (it) {
      if (it.nOk && it.rOk && !seen[it.c.id]) { seen[it.c.id] = true; flex.push(it.c); }
    });
    var combos = [];
    function addCombo(fn) {
      var m = {};
      flex.forEach(function (c) { m[c.id] = fn(c); });
      combos.push(m);
    }
    addCombo(function () { return false; });
    addCombo(function () { return true; });
    addCombo(function (c) { return c.w > c.l; });   // длинной стороной вдоль кузова
    addCombo(function (c) { return c.l > c.w; });   // длинной стороной поперек
    if (flex.length <= 8) {
      for (var mask = 0; mask < (1 << flex.length); mask++) {
        (function (mk) { addCombo(function (c) { return !!(mk & (1 << flex.indexOf(c))); }); })(mask);
      }
    }

    var best = null;
    function consider(pl) {
      if (!pl.length) return;
      var sc = scoreOf(pl);
      if (isBetter(sc, best && best.sc)) best = { pl: pl, sc: sc };
    }
    orders.forEach(function (cmp) {
      var sorted = towers.slice().sort(cmp);
      combos.forEach(function (m) {
        var rotOf = function (it) { return (it.nOk && it.rOk) ? m[it.c.id] : it.rOk; };
        consider(shelfPack(sorted, rotOf, d, false));
        consider(shelfPack(sorted, rotOf, d, true));
      });
      if (sorted.length <= 400) consider(maxRectsPack(sorted, d));
    });
    return best;
  }

  // сначала пробуем без штабелей, затем разрешаем по 2, 3... места в высоту, пока все не поместится
  function smartLayout(d) {
    var items = [];
    units.slice().sort(function (a, b) { return a.uid - b.uid; }).forEach(function (u) {
      var c = cargoById(u.cid);
      if (c.h > d.h) return;
      var nOk = c.l <= d.l && c.w <= d.w, rOk = c.w <= d.l && c.l <= d.w;
      if (nOk || rOk) items.push({ u: u, c: c, nOk: nOk, rOk: rOk });
    });
    if (!items.length) return null;

    var Lmax = 1;
    items.forEach(function (it) { Lmax = Math.max(Lmax, Math.min(12, Math.floor(d.h / it.c.h))); });

    var byType = {}, order = [];
    items.forEach(function (it) {
      if (!byType[it.c.id]) { byType[it.c.id] = []; order.push(it.c.id); }
      byType[it.c.id].push(it);
    });

    var best = null;
    for (var L = 1; L <= Lmax; L++) {
      var towers = [];
      order.forEach(function (id) {
        var arr = byType[id], c = arr[0].c;
        var cap = Math.max(1, Math.min(L, Math.floor(d.h / c.h)));
        for (var i = 0; i < arr.length; i += cap) {
          var grp = arr.slice(i, i + cap);
          towers.push({ u: grp[0].u, units: grp.map(function (x) { return x.u; }), c: c, nOk: arr[0].nOk, rOk: arr[0].rOk });
        }
      });
      var cand = packTowers(towers, d);
      if (!cand) continue;
      if (!best || cand.sc.vol > best.sc.vol) best = cand;   // при равенстве остается меньше этажей
      if (cand.sc.n === items.length) break;
    }
    return best;
  }

  $("auto").addEventListener("click", function () {
    var d = read();
    units.forEach(function (u) { u.placed = false; u.out = false; u.z = 0; u.rot = false; });
    var best = smartLayout(d);
    if (best) {
      best.pl.forEach(function (p) {
        var c = cargoById(p.u.cid);
        p.units.forEach(function (u, i) {
          u.x = p.x; u.y = p.y; u.rot = p.rot; u.placed = true; u.z = i * c.h;
        });
      });
    }
    var total = units.length, n = best ? best.sc.n : 0;
    autoNote = total ? ("Автораскладка: " + n + " из " + total + " мест" +
      (best ? ", занято по длине " + fmtDim(best.sc.len) + ", повернуто " + best.sc.rotN +
        (best.sc.lv > 1 ? ", в высоту до " + best.sc.lv + " мест" : "") : "") +
      (n < total ? ". Не поместилось: " + (total - n) : "") + ".") : "";
    update(false);
    autoSig = sigNow();
    renderAutoNote();
  });

  $("clear").addEventListener("click", function () {
    units.forEach(function (u) { u.placed = false; u.out = false; u.z = 0; });
    update(false);
  });

  // ---------- поворот ----------
  var msgTimer = null;
  function flash(text) {
    $("rot-msg").textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { $("rot-msg").textContent = ""; }, 2800);
  }

  function rotateSelected() {
    var u = selectedUnit();
    if (!u) return;
    var d = read(), old = dimsOf(u), nd = { l: old.w, w: old.l };
    if (nd.l > d.l || nd.w > d.w) { flash("В повернутом виде груз не помещается в кузов"); return; }
    u.rot = !u.rot;
    // поворот вокруг центра
    u.x = Math.round(clamp(u.x + (old.l - nd.l) / 2, 0, d.l - nd.l));
    u.y = Math.round(clamp(u.y + (old.w - nd.w) / 2, 0, d.w - nd.w));
    finalize(u, d);
    update(false);
  }

  $("rot").addEventListener("click", rotateSelected);
  svg.addEventListener("dblclick", rotateSelected);
  window.addEventListener("keydown", function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.code === "KeyR" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); rotateSelected(); }
  });

  // ---------- выбор типа упаковки ----------
  function renderTypes() {
    var box = $("types");
    box.innerHTML = PACK_TYPES.map(function (p) {
      var on = p.id === curType;
      return '<button type="button" role="radio" aria-checked="' + on + '" class="' + (on ? "on" : "") +
        '" data-type="' + p.id + '" title="' + p.name + '" aria-label="' + p.name + '">' + p.svg + '</button>';
    }).join("");
    $("type-name").textContent = typeDef(curType).name;
  }
  $("types").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-type]") : null;
    if (!b) return;
    curType = b.getAttribute("data-type");
    renderTypes();
  });
  renderTypes();

  // ---------- переключатель см / м ----------
  function setUnit(u) {
    var d = read();
    var form = [cmOf("c-l"), cmOf("c-w"), cmOf("c-h")];
    U = u;
    ["c-l", "c-w", "c-h"].forEach(function (id, i) {
      var inp = $(id);
      inp.value = form[i] > 0 ? toInput(form[i]) : "";
      inp.step = U === "m" ? "0.01" : "1";
      inp.min = U === "m" ? "0.01" : "1";
    });
    var vals = [d.l, d.w, d.h], ids = ["len", "wid", "hei"];
    var maxCm = [2000, 400, 400];
    ids.forEach(function (id, i) {
      var inp = $(id);
      inp.value = toInput(vals[i]);
      inp.step = U === "m" ? "0.01" : "1";
      inp.min = U === "m" ? "0.5" : "50";
      inp.max = U === "m" ? String(maxCm[i] / 100) : String(maxCm[i]);
    });
    document.querySelectorAll(".ulab").forEach(function (e) { e.textContent = U === "m" ? "м" : "см"; });
    document.querySelectorAll(".seg button").forEach(function (b) {
      var on = b.getAttribute("data-u") === U;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    try { localStorage.setItem("cargoUnit", U); } catch (err) {}
    update(false);
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { setUnit(b.getAttribute("data-u")); });
  });
  try { if (localStorage.getItem("cargoUnit") === "m") setUnit("m"); } catch (err) {}

  update(false);
})();
</script>
</body>
